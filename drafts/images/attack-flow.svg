<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 538" width="720" height="538" role="img" aria-labelledby="t">
<title id="t">ERC-4626 inflation attack in four steps: 1 wei deposit mints 1 share, 10,000 token donation lifts total assets, a 9,000 token deposit rounds to 0 shares (circled, noted 'rounds down to 0'), attacker redeems 19,000</title>
<rect width="720" height="538" rx="12" fill="#fcfcfb"/>
<text x="24" y="30" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#52514e">ERC-4626 INFLATION ATTACK</text>
<text x="24" y="60" font-family="Bricolage Grotesque, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4" fill="#0b0b0b">The inflation attack in four steps</text>
<g transform="translate(0 30)">
<text x="64" y="81" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0b0b0b" xml:space="preserve">1. Attacker deposits 1 wei</text>
<rect x="64" y="92" width="84" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="106.24000000000001" y="114" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">supply 1</text>
<rect x="154" y="92" width="117" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="212.84000000000003" y="114" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">assets 1 wei</text>
<text x="64" y="173" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0b0b0b" xml:space="preserve">2. Attacker sends 10,000 tokens straight to the vault</text>
<rect x="64" y="184" width="84" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="106.24000000000001" y="206" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">supply 1</text>
<rect x="154" y="184" width="125" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="216.87" y="206" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">assets 10,000</text>
<text x="64" y="265" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0b0b0b" xml:space="preserve">3. Victim deposits 9,000 tokens</text>
<rect x="64" y="276" width="238" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="182.81" y="298" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">9,000 × 1 / 10,000 = 0.8999</text>
<rect x="308" y="276" width="84" height="34" rx="6" fill="#fdeee8" fill-opacity="1" stroke="#eb6834" stroke-width="1.5"/>
<text x="349.86" y="298" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#eb6834" xml:space="preserve">0 shares</text>
<text x="64" y="357" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#0b0b0b" xml:space="preserve">4. Attacker redeems the 1 share</text>
<rect x="64" y="368" width="205" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="166.69" y="390" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">1 share = 19,000 tokens</text>
