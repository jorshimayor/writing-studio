<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" width="640" height="412" role="img" aria-labelledby="t">
<title id="t">LLM tokenisation pipeline: the word tokenization split into bytes, merged by BPE into two tokens, then mapped to integer IDs</title>
<rect width="640" height="412" rx="12" fill="#fcfcfb"/>
<text x="24" y="30" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#52514e">LLM TOKENISATION</text>
<text x="24" y="60" font-family="Bricolage Grotesque, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4" fill="#0b0b0b">What the model receives</text>
<g transform="translate(0 30)">
<text x="24" y="72" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">You type</text>
<rect x="24" y="84" width="159" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="103.44" y="106" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#0b0b0b" xml:space="preserve">"tokenization"</text>
<text x="24" y="140" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">1. Split into bytes (256 possible values, so nothing is ever unknown)</text>
<rect x="24" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="44" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">74</text>
<rect x="70" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="90" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">6f</text>
<rect x="116" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="136" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">6b</text>
<rect x="162" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="182" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">65</text>
<rect x="208" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="228" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">6e</text>
<rect x="254" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="274" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">69</text>
<rect x="300" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="320" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">7a</text>
<rect x="346" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="366" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">61</text>
<rect x="392" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="412" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">74</text>
<rect x="438" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="458" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">69</text>
<rect x="484" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="504" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">6f</text>
<rect x="530" y="150" width="40" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="550" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">6e</text>
<text x="24" y="210" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">2. Apply the learned merges, most frequent pairs first</text>
<rect x="24" y="220" width="70" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="58.8" y="242" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#0b0b0b" xml:space="preserve">token</text>
<rect x="100" y="220" width="89" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="144.32" y="242" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#0b0b0b" xml:space="preserve">ization</text>
<text x="205.04" y="242" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">2 tokens, not 1 word and not 12 characters</text>
<text x="24" y="280" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">3. Look up the integer IDs. This list is all the model ever sees</text>
<rect x="24" y="290" width="70" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="58.8" y="312" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#52514e" xml:space="preserve">30001</text>
<rect x="100" y="290" width="60" height="34" rx="6" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="129.44" y="312" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#52514e" xml:space="preserve">1634</text>
<text x="24" y="312" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8a8984" xml:space="preserve"></text>
<text x="175.28" y="312" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8a8984" xml:space="preserve">IDs shown for illustration; check them in the notebook</text>
