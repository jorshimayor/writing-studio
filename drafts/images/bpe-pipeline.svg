<polygon points="14,216 11,209 17,209" fill="#8a8984"/>
<line x1="14" y1="254" x2="14" y2="286" stroke="#8a8984" stroke-width="1.5"/>
<polygon points="14,286 11,279 17,279" fill="#8a8984"/>
</g>
<line x1="24" y1="382" x2="616" y2="382" stroke="#d9d8d3" stroke-width="1"/><text x="616" y="402" text-anchor="end" font-family="Bricolage Grotesque, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="-0.3" fill="#8a8984">jorshimayor</text>
</svg>