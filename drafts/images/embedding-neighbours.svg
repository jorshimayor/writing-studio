<text x="24" y="262" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">Each of the 50,257 IDs maps to a 768-dimensional vector. Similar tokens end up close together, but the</text>
<text x="24" y="280" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">model had to learn on its own that “ Paris” and “Paris” are the same city. Positions are schematic.</text>
