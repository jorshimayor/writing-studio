<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 368" width="700" height="368" role="img" aria-labelledby="t">
<title id="t">Nearest neighbours in GPT-2's embedding space: king next to queen, prince, and monarch; 7 next to 6, 8, and 5; Paris and space-Paris as two separate points, noted 'two separate rows'</title>
