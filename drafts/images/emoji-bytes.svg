<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 462" width="700" height="462" role="img" aria-labelledby="t">
<title id="t">One emoji is four UTF-8 bytes; GPT-2 splits it into two tokens of two bytes each, and each token alone decodes to the replacement character (circled)</title>
<rect width="700" height="462" rx="12" fill="#fcfcfb"/>
<text x="24" y="30" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#52514e">LLM TOKENISATION</text>
<text x="24" y="60" font-family="Bricolage Grotesque, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4" fill="#0b0b0b">One emoji, four bytes, two tokens</text>
<g transform="translate(0 30)">
<text x="24" y="70" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">You type</text>
<rect x="24" y="82" width="60" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="54.0" y="104" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#0b0b0b" xml:space="preserve">🙂</text>
<text x="96" y="104" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">one character on your screen</text>
<text x="24" y="140" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">UTF-8 stores it as 4 bytes</text>
<rect x="24" y="150" width="56" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="52" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">f0</text>
<rect x="86" y="150" width="56" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="114" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">9f</text>
<rect x="148" y="150" width="56" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="176" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">99</text>
<rect x="210" y="150" width="56" height="30" rx="5" fill="#fcfcfb" fill-opacity="1" stroke="#d9d8d3" stroke-width="1.5"/>
<text x="238" y="170" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#0b0b0b" xml:space="preserve">82</text>
<text x="24" y="212" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">GPT-2 never merged all four, so it uses 2 tokens of 2 bytes each</text>
<rect x="24" y="222" width="118" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="83.0" y="244" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#0b0b0b" xml:space="preserve">f0 9f</text>
<rect x="148" y="222" width="118" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="207.0" y="244" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#0b0b0b" xml:space="preserve">99 82</text>
<text x="284" y="244" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">bytes 1 and 2, then bytes 3 and 4</text>
<text x="24" y="286" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">Decode each token alone and you get half a character</text>
<rect x="24" y="296" width="60" height="34" rx="6" fill="#fdeee8" fill-opacity="1" stroke="#eb6834" stroke-width="1.5"/>
<text x="54.0" y="318" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#eb6834" xml:space="preserve">�</text>
<rect x="90" y="296" width="60" height="34" rx="6" fill="#fdeee8" fill-opacity="1" stroke="#eb6834" stroke-width="1.5"/>
<text x="120.0" y="318" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#eb6834" xml:space="preserve">�</text>
<polyline points="135.1,299.6 138.5,301.2 141.8,302.8 145.0,304.5 148.0,306.2 150.7,308.1 152.9,310.1 154.4,312.1 155.1,314.3 154.8,316.4 153.6,318.5 151.6,320.6 149.0,322.5 145.8,324.4 142.1,326.2 138.1,327.8 133.7,329.3 128.9,330.8 123.7,332.0 118.2,333.1 112.3,333.9 106.2,334.4 99.9,334.8 93.7,334.9 87.5,334.8 81.4,334.5 75.3,334.2 69.3,333.8 63.3,333.3 57.2,332.8 51.1,332.1 45.1,331.3 39.3,330.2 34.0,328.8 29.3,327.2 25.5,325.3 22.7,323.3 20.7,321.1 19.7,318.9 19.3,316.7 19.4,314.6 19.9,312.5 20.7,310.4 21.8,308.3 23.2,306.3 25.1,304.2 27.5,302.3 30.5,300.4 34.1,298.6 38.3,297.0 43.0,295.5 48.1,294.2 53.5,293.0 59.2,292.0 65.1,291.0 71.2,290.2 77.6,289.6 84.2,289.1 91.0,288.9 97.9,289.0 104.6,289.5 111.0,290.2 117.0,291.3 122.5,292.7 127.4,294.2 131.8,295.8 135.8,297.5 139.5,299.2 143.1,300.9 146.6,302.7 149.9,304.5 153.0,306.4 155.7,308.5 157.7,310.6" fill="none" stroke="#d1203f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="162" y="318" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52514e" xml:space="preserve">decode both together →</text>
<rect x="326" y="296" width="60" height="34" rx="6" fill="#eef3fb" fill-opacity="1" stroke="#2a78d6" stroke-width="1.5"/>
<text x="356.0" y="318" text-anchor="middle" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="normal" fill="#0b0b0b" xml:space="preserve">🙂</text>
<text x="24" y="356" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">The 🙂 emoji is 4 bytes. GPT-2 holds it as two tokens of two bytes each. Half an emoji is not a character,</text>
<text x="24" y="374" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52514e" xml:space="preserve">so decoding one token shows �. The family emoji is 18 bytes and ten tokens the same way.</text>
</g>
<line x1="24" y1="432" x2="676" y2="432" stroke="#d9d8d3" stroke-width="1"/><text x="676" y="452" text-anchor="end" font-family="Bricolage Grotesque, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="-0.3" fill="#8a8984">jorshimayor</text>
</svg>